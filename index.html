<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ASRAR PRO — Administration</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ÉCRAN DE CONNEXION -->
  <div id="login" class="login-wrap">
    <div class="login-box">
      <img src="/assets/logo-mark.png" alt="ASRAR PRO" class="login-logo">
      <h1>Administration</h1>
      <p class="muted">Panneau de contrôle ASRAR PRO — accès réservé.</p>
      <button id="btnLogin" class="btn primary">Se connecter avec Google</button>
      <p id="loginMsg" class="msg"></p>
    </div>
  </div>

  <!-- APPLICATION -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="/assets/logo-mark.png" alt="">
        <span>ASRAR PRO · Admin</span>
      </div>
      <div class="who">
        <span id="meEmail" class="muted"></span>
        <button id="btnLogout" class="btn ghost small">Déconnexion</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="dash">📊 Tableau de bord</button>
      <button class="tab" data-tab="content">📝 Contenus</button>
      <button class="tab" data-tab="market">🛒 Marché</button>
      <button class="tab" data-tab="users">👥 Utilisateurs</button>
      <button class="tab" data-tab="audit">🧾 Journal</button>
      <button class="tab" data-tab="settings">⚙️ Réglages</button>
    </nav>

    <!-- TABLEAU DE BORD -->
    <section id="tab-dash" class="panel">
      <div class="cards" id="kpis"></div>
      <div class="grid2">
        <div class="block">
          <div class="block-head">
            <h3>Visites journalières</h3>
            <select id="rangeSel">
              <option value="14">14 jours</option>
              <option value="30" selected>30 jours</option>
              <option value="90">90 jours</option>
            </select>
          </div>
          <div id="chartDaily" class="chart"></div>
        </div>
        <div class="block">
          <h3>Visites mensuelles</h3>
          <div id="chartMonthly" class="chart"></div>
        </div>
      </div>
      <div class="block">
        <h3>Activité récente</h3>
        <div id="feed" class="feed"></div>
      </div>
    </section>

    <!-- CONTENUS -->
    <section id="tab-content" class="panel" hidden>
      <div class="block">
        <div class="block-head">
          <h3 class="star">Contenus par page</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <select id="nodeSel"></select>
            <button id="btnExport" class="btn ghost sm">⬇️ Exporter</button>
            <button id="btnAdd" class="btn primary sm">➕ Ajouter</button>
          </div>
        </div>
        <p class="muted sm" id="nodeInfo" style="margin-bottom:14px"></p>
        <div id="itemList" class="card-grid"></div>
      </div>
    </section>

    <!-- MARCHÉ -->
    <section id="tab-market" class="panel" hidden>
      <div class="cards" id="marketKpis"></div>
      <div class="block">
        <div class="block-head">
          <h3 class="star">Produits</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input id="prodSearch" type="search" placeholder="Rechercher…">
            <button id="btnAddProduct" class="btn primary sm">➕ Produit</button>
          </div>
        </div>
        <div id="prodList" class="card-grid"></div>
      </div>
      <div class="block">
        <h3 class="star">Vendeurs &amp; boutiques</h3>
        <div id="sellerList" class="list"></div>
      </div>
    </section>

    <!-- UTILISATEURS -->
    <section id="tab-users" class="panel" hidden>
      <div class="block">
        <div class="block-head">
          <h3>Utilisateurs <span id="userCount" class="muted"></span></h3>
          <input id="userSearch" type="search" placeholder="Rechercher un email…">
        </div>
        <div id="userList" class="list"></div>
      </div>
    </section>

    <!-- JOURNAL -->
    <section id="tab-audit" class="panel" hidden>
      <div class="block">
        <h3>Journal des actions admin</h3>
        <div id="auditList" class="list"></div>
      </div>
    </section>

    <!-- RÉGLAGES -->
    <section id="tab-settings" class="panel" hidden>
      <div class="block">
        <h3 class="star">Contrôle global de l'application</h3>
        <label class="switch-row">
          <span class="switch"><input type="checkbox" id="cfgMaintenance"><span></span></span>
          <span><b>Mode maintenance</b> — l'app affiche un écran d'attente aux utilisateurs.</span>
        </label>
        <label class="field-lg">
          <span>Annonce globale (bandeau dans l'app · vide = masqué)</span>
          <textarea id="cfgAnnouncement" rows="3" maxlength="300"
            placeholder="Ex. : Nouvelle bibliothèque disponible cette semaine…"></textarea>
        </label>
        <button id="btnSaveCfg" class="btn primary">Enregistrer</button>
        <p id="cfgMsg" class="msg"></p>
      </div>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
