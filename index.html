<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ASRAR PRO — Administration</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d0b07">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div id="toast-container"></div>
  <button id="themeToggle" class="theme-btn" title="Basculer clair / sombre" aria-label="Basculer le thème">🌙</button>

  <div id="login" class="login-wrap">
    <div class="login-box">
      <img src="/assets/logo-mark.png" alt="ASRAR PRO" class="login-logo">
      <h1>Administration</h1>
      <p class="muted">Panneau de contrôle ASRAR PRO — Accès strictement réservé.</p>
      
      <form id="loginForm">
        <div class="form-group">
          <input type="email" id="loginEmail" placeholder="Email de l'administrateur" required autocomplete="username">
        </div>
        <div class="form-group">
          <input type="password" id="loginPassword" placeholder="Mot de passe" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn primary full-width">Se connecter au sanctuaire</button>
      </form>
      
      <p id="loginMsg" class="msg"></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="/assets/logo-full.png" alt="ASRAR PRO">
      </div>
      <nav class="nav">
        <button data-tab="content" class="active">Contenus</button>
        <button data-tab="market">Marché</button>
        <button data-tab="users">Utilisateurs</button>
        <button data-tab="analytics">Analytique</button>
        <button data-tab="visits">Visites</button>
        <button data-tab="audit">Journal d'Audit</button>
        <button data-tab="settings">Réglages</button>
        <button id="btnLogout" class="btn-out">Quitter</button>
      </nav>
    </header>

    <main class="main-container">
      
      <section id="tab-content" class="panel">
        <div class="sidebar">
          <h3>Bibliothèques</h3>
          <button id="btnNewSecret" class="btn primary full-width" style="margin-bottom:12px">✦ Nouveau secret / document</button>
          <div id="nodeList" class="menu"></div>
        </div>
        <div class="main-content">
          <button id="btnBackNodes" class="btn text mobile-only" hidden>← Bibliothèques</button>
          <div class="bar">
            <h2 id="currentNodeTitle">Sélectionnez une bibliothèque</h2>
            <div class="bar-actions" id="contentActions" style="display:none">
              <button id="btnSelectMode" class="btn text">☑ Sélection</button>
              <button id="btnAddItem" class="btn primary">+ Ajouter</button>
              <button id="btnAddDocument" class="btn primary" hidden>+ Document (Almaqtab)</button>
            </div>
          </div>

          <div id="bulkBar" class="bulkbar" hidden>
            <span id="bulkCount">0 sélectionné(s)</span>
            <button id="bulkSelectAll" class="btn text">Tout</button>
            <select id="bulkTarget" class="bulk-select" title="Déplacer vers…"></select>
            <button id="bulkMove" class="btn text">Déplacer</button>
            <button id="bulkDelete" class="btn text danger-text">Supprimer</button>
            <button id="bulkCancel" class="btn text">Annuler</button>
          </div>

          <div id="cardsGrid" class="grid"></div>
          <button id="btnMoreItems" class="btn text load-more" hidden>Afficher 50 de plus</button>
        </div>
      </section>

      <section id="tab-market" class="panel" hidden>
        <div class="block">
          <div class="bar">
            <h3 class="star">Boutiques <span id="shopCount" class="muted"></span></h3>
            <button id="btnBlockExpired" class="btn danger">Bloquer les boutiques expirées</button>
            <button id="btnAddShop" class="btn primary">+ Ajouter une boutique</button>
          </div>
          <input type="text" id="shopSearch" placeholder="Rechercher une boutique (nom ou e-mail)…">
          <div id="shopList" class="list"></div>
        </div>
        <div class="block">
          <div class="bar">
            <h3>Produits <span id="prodCount" class="muted"></span></h3>
            <input type="text" id="prodSearch" placeholder="Rechercher un produit…">
          </div>
          <div id="prodGrid" class="grid"></div>
          <button id="btnMoreProds" class="btn text load-more" hidden>Afficher 50 de plus</button>
        </div>
      </section>

      <section id="tab-users" class="panel" hidden>
        <!-- reste inchangé -->
      </section>

      <section id="tab-analytics" class="panel" hidden>
        <!-- reste inchangé -->
      </section>

      <section id="tab-visits" class="panel" hidden>
        <!-- reste inchangé -->
      </section>

      <section id="tab-audit" class="panel" hidden>
        <!-- reste inchangé -->
      </section>

      <section id="tab-settings" class="panel" hidden>
        <!-- reste inchangé -->
      </section>

    </main>
  </div>

  <div id="big" class="bigwrap" hidden>
    <div class="bigcard" id="bigcard"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="/api/config" defer></script>
  <script src="admin-core.js" defer></script>
<script src="admin-content.js" defer></script>
<script src="admin-market.js" defer></script>
<script src="admin-users.js" defer></script>
<script src="admin-stats.js" defer></script>
  <script src="pwa.js" defer></script>
</body>
</html>
